name: Build

# Every push to main builds all three versions (download them under the run's Artifacts).
# Pushing a tag like v0.1.0 also publishes them together as a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-apple-silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macos-intel
            runner: macos-latest
            target: x86_64-apple-darwin
            files: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            files: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Unit tests
        if: matrix.name == 'macos-apple-silicon'
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build app
        run: npx tauri build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: MidiMaster-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          name: MidiMaster ${{ github.ref_name }}
          body: |
            | Your computer | Download |
            |---|---|
            | Mac with Apple Silicon (M1, M2, M3, M4…) | `MidiMaster_*_aarch64.dmg` |
            | Mac with Intel processor | `MidiMaster_*_x64.dmg` |
            | Windows 10 / 11 | `MidiMaster_*_x64-setup.exe` (or the `.msi`) |

            See the README for first-launch steps.
          files: dist/**/*
