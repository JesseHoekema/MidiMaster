name: Build

# Every push to main builds all three versions (download them under the run's Artifacts).
# Pushing a tag like v0.2.0 publishes them as a GitHub release, plus latest.json,
# the update feed the app checks.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos_silicon
            runner: macos-latest
            target: aarch64-apple-darwin
          - platform: macos_intel
            runner: macos-latest
            target: x86_64-apple-darwin
          - platform: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    env:
      # signs the update bundles; without it the build can't make updates
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Unit tests
        if: matrix.platform == 'macos_silicon'
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build app
        run: npx tauri build --target ${{ matrix.target }}

      - name: Name the files after the platform
        shell: bash
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          B=src-tauri/target/${{ matrix.target }}/release/bundle
          P=MidiMaster_${V}_${{ matrix.platform }}
          mkdir -p out
          if [ "${{ matrix.platform }}" = windows ]; then
            cp $B/nsis/*-setup.exe      out/${P}_setup.exe
            cp $B/nsis/*-setup.exe.sig  out/${P}_setup.exe.sig
            cp $B/msi/*.msi             out/${P}.msi
          else
            cp $B/dmg/*.dmg                out/${P}.dmg
            cp $B/macos/*.app.tar.gz       out/${P}.app.tar.gz
            cp $B/macos/*.app.tar.gz.sig   out/${P}.app.tar.gz.sig
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: MidiMaster_${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes (from CHANGELOG.md) and update feed (latest.json)
        run: |
          node - <<'EOF'
          const fs = require("fs");
          const v = require("./src-tauri/tauri.conf.json").version;

          // this version's section of CHANGELOG.md, without its heading
          const log = fs.readFileSync("CHANGELOG.md", "utf8");
          const m = log.match(new RegExp(`^## \\[${v.replace(/\./g, "\\.")}\\][^\\n]*\\n([\\s\\S]*?)(?=^## \\[|(?![\\s\\S]))`, "m"));
          if (!m) {
            console.error(`CHANGELOG.md has no section for ${v}. Add "## [${v}]" before releasing.`);
            process.exit(1);
          }
          const changes = m[1].trim();

          const table = [
            "## Download",
            "",
            "| Your computer | File |",
            "|---|---|",
            `| Mac with Apple Silicon (M1, M2, M3, M4…) | \`MidiMaster_${v}_macos_silicon.dmg\` |`,
            `| Mac with an Intel processor | \`MidiMaster_${v}_macos_intel.dmg\` |`,
            `| Windows 10 / 11 | \`MidiMaster_${v}_windows_setup.exe\` (or the \`.msi\`) |`,
            "",
            "Already have MidiMaster 0.2.0 or newer? It offers this update by itself.",
            "The `.app.tar.gz` files and `latest.json` are for the built-in updater.",
          ].join("\n");
          fs.writeFileSync("release_notes.md", `${changes.replace(/^### /gm, "## ")}\n\n${table}\n`);

          // plain text for the update popup in the app
          const plain = changes
            .replace(/^### (.*)$/gm, "$1:")
            .replace(/\*\*(.*?)\*\*/g, "$1")
            .replace(/`([^`]*)`/g, "$1")
            .replace(/^- /gm, "• ")
            .replace(/\n {2,}/g, " ");

          const base = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/v${v}`;
          const entry = (file) => ({
            url: `${base}/${file}`,
            signature: fs.readFileSync(`dist/${file}.sig`, "utf8").trim(),
          });
          const feed = {
            version: v,
            notes: plain,
            pub_date: new Date().toISOString(),
            platforms: {
              "darwin-aarch64": entry(`MidiMaster_${v}_macos_silicon.app.tar.gz`),
              "darwin-x86_64": entry(`MidiMaster_${v}_macos_intel.app.tar.gz`),
              "windows-x86_64": entry(`MidiMaster_${v}_windows_setup.exe`),
            },
          };
          fs.writeFileSync("dist/latest.json", JSON.stringify(feed, null, 2));
          console.log(fs.readFileSync("release_notes.md", "utf8"));
          EOF
          rm dist/*.sig
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          name: MidiMaster ${{ github.ref_name }}
          body_path: release_notes.md
          files: dist/*
