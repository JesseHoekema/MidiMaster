  window.__TAURI_INTERNALS__ = {
    metadata: { currentWindow: { label: "main" }, currentWebview: { windowLabel: "main", label: "main" } },
    transformCallback(cb) { const id = ++cbId; window["_" + id] = cb; return id; },
    async invoke(cmd, args) {
      if (cmd === "plugin:event|listen") { (handlers[args.event] ??= []).push(args.handler); return args.handler; }
      if (cmd === "plugin:event|unlisten") return;
      if (cmd === "get_config") return structuredClone(config);
      if (cmd === "save_config") { Object.assign(config, args.config); return; }

      return null;
    },
  };
  function emit(event, payload) { for (const h of handlers[event] ?? []) window["_" + h]?.({ event, id: 0, payload }); }
  // fake hardware: send a CC on channel 1; the matching control moves like the real backend would make it
  window.sim = (cc, value) => {
    emit("midi", { port: "RP2040 Zero", channel: 1, kind: "cc", number: cc, value });
    const p = config.profiles.find((p) => p.id === config.activeProfile);
    for (const c of p.controls) {
      if (c.binding?.kind === "cc" && c.binding.number === cc) emit("control", { id: c.id, x: value / 127, y: 0 });
      if (c.bindingY?.kind === "cc" && c.bindingY.number === cc) emit("control", { id: c.id, x: 0.5, y: value / 127 });
    }
  };
