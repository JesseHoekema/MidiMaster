    async invoke(cmd, args) {
      if (cmd === "plugin:event|listen") { (handlers[args.event] ??= []).push(args.handler); return args.handler; }

      if (cmd === "get_config") return structuredClone(config);
      if (cmd === "save_config") { Object.assign(config, args.config); return; }

    const p = config.profiles.find((p) => p.id === config.activeProfile);
    for (const c of p.controls) {
      if (c.binding?.kind === "cc" && c.binding.number === cc) emit("control", { id: c.id, x: value / 127, y: 0 });

<script>
  // ?demo=1&tab=Monitor&select=fader1&dialog=1 : fill the screen for README screenshots

    config.profiles[0].layers = ["Music", "Streaming"];
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const click = (sel, text) => [...document.querySelectorAll(sel)].find((b) => b.textContent.trim().includes(text))?.click();
    window.addEventListener("load", async () => {
      await wait(600);
      const tab = params.get("tab");
      if (tab) click(".rail .dest", tab);
      await wait(200);
      for (const [cc, v] of [[7, 96], [8, 60], [9, 110], [10, 30], [11, 75], [16, 90], [23, 40], [24, 120], [25, 10], [26, 64], [20, 92], [21, 96], [99, 12], [27, 127]]) sim(cc, v);
      await wait(1500); // let the "just moved" glow fade
      if (tab === "Deck") click("button", "Connect");
      const sel = params.get("select");
      if (sel) {
        const i = config.profiles[0].controls.findIndex((c) => c.id === sel);
        document.querySelectorAll(".item")[i]?.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, button: 0 }));
      }
      if (params.get("dialog")) { click("button", "New"); await wait(1500); }
      if (params.get("live")) click(".seg button", "Live");
      await wait(500);
    });
  }
